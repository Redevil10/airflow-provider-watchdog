[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-plugin-watchdog"
version = "0.6.0"
description = "A lightweight, zero-dependency Airflow plugin that monitors DAG/task health by querying the metadata DB — runtime anomalies, failure spikes, missed deadlines, stuck tasks, and schedule anomalies."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Qing Wan", email = "juveseason@gmail.com" },
]
keywords = [
    "airflow",
    "monitoring",
    "anomaly-detection",
    "dag-health",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Apache Airflow",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "apache-airflow>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "prek",
    "tox>=4.0",
    # Drivers for running the integration suite against a real metadata DB.
    "psycopg2-binary",
    "asyncpg",
]

[project.urls]
Repository = "https://github.com/Redevil10/airflow-provider-watchdog"

# Register the plugin (dashboard, nav link, detection scheduler) via Airflow's
# generic plugin entry point. This is the only registration the package needs —
# it is loaded at API-server startup regardless of ``LAZY_LOAD_PROVIDERS``. The
# package is intentionally a plain Airflow plugin, not a provider, so there is no
# ``apache_airflow_provider`` entry point.
[project.entry-points."airflow.plugins"]
watchdog = "airflow_watchdog.plugin:WatchdogPlugin"

[tool.hatch.build.targets.wheel]
packages = ["airflow_watchdog"]

[tool.hatch.build.targets.wheel.force-include]
"airflow_watchdog/py.typed" = "airflow_watchdog/py.typed"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# Default to the unit suite so a bare `pytest` never touches the integration
# harness. Run integration explicitly: `pytest tests/integration -m integration`.
testpaths = ["tests/unit"]
pythonpath = ["."]
# Integration tests need a real Airflow metadata DB; skip them by default and
# run them explicitly with `pytest -m integration` (see integration.yml).
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end tests against a real Airflow metadata DB",
]

[tool.tox]
env_list = ["airflow3"]

[tool.tox.env.airflow3]
description = "Test against Apache Airflow 3.x"
skip_install = true
set_env = "PYTHONPATH = {toxinidir}"
deps = [
    "apache-airflow>=3.0",
    "pytest>=8.0",
    "pytest-cov",
]
commands = [["pytest", "--cov=airflow_watchdog", "--cov-report=xml", "{posargs:tests/unit}"]]

[tool.tox.env.verify-airflow3]
description = "Verify the published PyPI package works with Airflow 3.x"
skip_install = true
deps = [
    "airflow-plugin-watchdog",
    "apache-airflow>=3.0",
    "pytest>=8.0",
]
commands = [["pytest", "{posargs:tests/unit}"]]
